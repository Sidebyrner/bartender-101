# XcodeGen project definition — now the primary way to (re)generate the
# project, not just a fallback. This repo has two application targets
# sharing one folder of source files, and that shape is materially harder
# to hand-edit correctly in project.pbxproj than the original single-target
# project was (still written blind — no Mac available in this environment).
# If Xcode reports the checked-in project is damaged, malformed, or won't
# open, regenerate a known-good one instead of debugging the pbxproj by hand:
#
#   brew install xcodegen
#   xcodegen generate
#
# Nothing here needs updating when a drink or a Swift file is added later —
# every target picks up its sources by directory, Shared/ included.

name: Bartender101
options:
  bundleIdPrefix: com.bartender101
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_PREVIEWS: YES

targets:
  Bartender101:
    type: application
    platform: iOS
    sources:
      - path: Bartender101
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartender101.Bartender101
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Bartender 101"

  Bartender101Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Bartender101Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartender101.Bartender101Tests
    dependencies:
      - target: Bartender101

  DrinksCodex:
    type: application
    platform: iOS
    sources:
      - path: DrinksCodex
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartender101.DrinksCodex
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Drinks Codex"

  DrinksCodexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DrinksCodexTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartender101.DrinksCodexTests
    dependencies:
      - target: DrinksCodex

schemes:
  Bartender101:
    build:
      targets:
        Bartender101: all
        Bartender101Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Bartender101Tests
    archive:
      config: Release

  DrinksCodex:
    build:
      targets:
        DrinksCodex: all
        DrinksCodexTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DrinksCodexTests
    archive:
      config: Release
