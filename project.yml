# XcodeGen project definition — the fallback if the committed
# Bartender101.xcodeproj ever fails to open or misbehaves in Xcode.
#
# That project was hand-written without ever being opened in Xcode (this
# repo was built in a Linux-only environment with no Mac available), so if
# something about it is malformed, regenerate a known-good one instead of
# debugging the broken pbxproj by hand:
#
#   brew install xcodegen
#   xcodegen generate
#
# This produces a fresh Bartender101.xcodeproj from the folders on disk —
# nothing here needs updating when a drink or a Swift file is added later,
# since both targets pick up their sources by directory.

name: Bartender101
options:
  bundleIdPrefix: com.bartender101
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    ENABLE_PREVIEWS: YES

targets:
  Bartender101:
    type: application
    platform: iOS
    sources:
      - path: Bartender101
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartender101.Bartender101
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Bartender 101"

  Bartender101Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Bartender101Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bartender101.Bartender101Tests
    dependencies:
      - target: Bartender101

schemes:
  Bartender101:
    build:
      targets:
        Bartender101: all
        Bartender101Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Bartender101Tests
    archive:
      config: Release
